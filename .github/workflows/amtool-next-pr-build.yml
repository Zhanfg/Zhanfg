name: AMTool Next PR Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'amtool-next/**'
      - '.github/workflows/amtool-next-pr-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 17 preview SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build debug APK
        working-directory: amtool-next
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMTool-Next-2.0.0-alpha1-debug
          path: amtool-next/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
