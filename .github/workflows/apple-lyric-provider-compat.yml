name: Apple Lyric Provider AMTool Compat

on:
  push:
    branches:
      - 'project/amtool-next-v2'
    paths:
      - 'apple-lyric-provider-compat/**'
      - '.github/workflows/apple-lyric-provider-compat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout provider upstream
        uses: actions/checkout@v4
        with:
          repository: Andrea-lyz/ColorOS-Live-Lyrics-Providers
          ref: b2d07c34efc917d21b28fa246cb2a004269484d4
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || yes | sdkmanager "platforms;android-37"

      - name: Apply AMTool compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          target="source/player-apple/src/main/kotlin/io/github/andrealtb/coloroslyrics/provider/apple"
          cp overlay/apple-lyric-provider-compat/AppleTrackIdentity.kt "$target/AppleTrackIdentity.kt"
          cp overlay/apple-lyric-provider-compat/AppleTrackBindPolicy.kt "$target/AppleTrackBindPolicy.kt"
          cp overlay/apple-lyric-provider-compat/AppleSongParser.kt "$target/AppleSongParser.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/player-apple/build.gradle.kts")
          s = p.read_text()
          s = s.replace('versionName = "1.2.0"', 'versionName = "1.2.0-hotfix1-amtool"')
          p.write_text(s)
          PY

      - name: Build and test
        working-directory: source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon             :player-apple:testDebugUnitTest             :player-apple:assembleDebug             :player-apple:verifyXposedApi102Resources

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-Lyric-Provider-1.2.0-hotfix1-amtool
          path: source/player-apple/build/outputs/apk/debug/*.apk
          if-no-files-found: error
