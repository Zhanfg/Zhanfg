name: Phigros Android Extractor Build

on:
  push:
    branches:
      - ci/phigros-native-build
    paths:
      - 'scratch/phigros-android-extractor/**'
      - '.github/workflows/phigros-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore FFmpegKitNext arm64 cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: scratch/phigros-android-extractor/local-maven
          key: ffmpeg-kit-next-8.1.1-api26-arm64-lame-v2

      - name: Install Nix
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build FFmpegKitNext arm64 audio bundle
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/ffmpeg-kit-next"
          git clone --depth 1 --branch v8.1.1 \
            https://github.com/arthenica/ffmpeg-kit-next.git \
            "$RUNNER_TEMP/ffmpeg-kit-next"

          cd "$RUNNER_TEMP/ffmpeg-kit-next"
          ./nix-android.sh -p android-r27d \
            --api-level=26 \
            --enable-lame \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64 \
            --jobs=2

          MAVEN_ROOT="$(find prebuilt -maxdepth 1 -type d -name 'bundle-android-aar-*-maven' | head -n 1)"
          test -n "$MAVEN_ROOT"
          test -f "$(find "$MAVEN_ROOT" -type f -name 'ffmpeg-kit-next-8.1.1.aar' | head -n 1)"

          rm -rf "$GITHUB_WORKSPACE/scratch/phigros-android-extractor/local-maven"
          mkdir -p "$GITHUB_WORKSPACE/scratch/phigros-android-extractor/local-maven"
          cp -a "$MAVEN_ROOT/." "$GITHUB_WORKSPACE/scratch/phigros-android-extractor/local-maven/"

      - name: Validate FFmpegKitNext local repository
        shell: bash
        run: |
          test -f "$(find scratch/phigros-android-extractor/local-maven -type f -name 'ffmpeg-kit-next-8.1.1.aar' | head -n 1)"
          du -sh scratch/phigros-android-extractor/local-maven

      - name: Vendor python-fsb5
        shell: bash
        run: |
          rm -rf scratch/phigros-android-extractor/app/vendor/python-fsb5
          mkdir -p scratch/phigros-android-extractor/app/vendor
          git clone --quiet https://github.com/HearthSim/python-fsb5.git scratch/phigros-android-extractor/app/vendor/python-fsb5
          git -C scratch/phigros-android-extractor/app/vendor/python-fsb5 checkout --quiet 5acfaed9b44167eeebbd5f0414745cc23a2104a7
          rm -rf scratch/phigros-android-extractor/app/vendor/python-fsb5/.git
          test -f scratch/phigros-android-extractor/app/vendor/python-fsb5/fsb5/__init__.py
          test -f scratch/phigros-android-extractor/app/vendor/python-fsb5/fsb5/vorbis_headers.py

      - name: Validate source tree
        shell: bash
        run: |
          test -f scratch/phigros-android-extractor/app/build.gradle
          test -f scratch/phigros-android-extractor/app/src/main/java/cc/axymorrsen/phigrosextractor/MainActivity.kt
          test -f scratch/phigros-android-extractor/app/src/main/java/cc/axymorrsen/phigrosextractor/RemoteCatalog.kt
          test -f scratch/phigros-android-extractor/app/src/main/java/cc/axymorrsen/phigrosextractor/AudioProcessor.kt
          test -f scratch/phigros-android-extractor/app/src/main/python/extractor.py
          python -m py_compile scratch/phigros-android-extractor/app/src/main/python/extractor.py

      - name: Build debug APK
        working-directory: scratch/phigros-android-extractor
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect APK native payload
        shell: bash
        run: |
          APK=scratch/phigros-android-extractor/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' | head -n 50
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phigros-music-extractor-m3e-debug
          path: scratch/phigros-android-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
