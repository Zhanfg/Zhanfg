name: AMTool Next Build

on:
  push:
    branches:
      - 'project/amtool-next-v2'
    paths:
      - 'amtool-next/**'
      - '.github/workflows/amtool-next-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" || yes | sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build debug APKs
        working-directory: amtool-next
        run: gradle --no-daemon :app:assembleDebug :provider-compat-injector:assembleDebug
      - name: Upload AMTool APK
        uses: actions/upload-artifact@v4
        with:
          name: AMTool-Next-2.0.0-alpha3-hotfix6-debug
          path: amtool-next/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload provider compatibility helper
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Provider-AMTool-Compat-Hotfix2
          path: amtool-next/provider-compat-injector/build/outputs/apk/debug/*.apk
          if-no-files-found: error
