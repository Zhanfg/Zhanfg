name: AMTool Next Build

on:
  push:
    branches:
      - 'project/amtool-next-v2'
    paths:
      - 'amtool-next/**'
      - '.github/workflows/amtool-next-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Test and build debug APK
        working-directory: amtool-next
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain
      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          APK="$(find amtool-next/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F "META-INF/xposed/java_init.list"
          unzip -l "$APK" | grep -F "META-INF/xposed/module.prop"
          unzip -l "$APK" | grep -F "META-INF/xposed/scope.list"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMTool-Next-2.0.0-alpha1-debug
          path: amtool-next/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
