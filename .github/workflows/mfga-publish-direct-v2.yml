name: MFGA Publish Direct Flash ZIP v2

on:
  push:
    branches:
      - tmp/mfga-fast-build-20260828
    paths:
      - .github/workflows/mfga-publish-direct-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified module ZIP directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mfga/out
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' '/repos/Zhanfg/Zhanfg/actions/artifacts/9692419524/zip' > /tmp/mfga/wrapper.zip
          unzip -q /tmp/mfga/wrapper.zip -d /tmp/mfga/out
          MOD='/tmp/mfga/out/MFGA-LXGW-SourceSans3-FastPublic-20260828.zip'
          test -f "$MOD"
          unzip -p "$MOD" module.prop | grep -q '^id=MFGA$'
          unzip -l "$MOD" | grep -q 'META-INF/com/google/android/update-binary'
          unzip -l "$MOD" | grep -q 'customize.sh'
          unzip -t "$MOD" >/tmp/mfga/ZIP-TEST.txt
          sha256sum "$MOD" | tee /tmp/mfga/SHA256SUMS.txt
          TAG='mfga-fast-public-20260828-r1'
          gh release delete "$TAG" --repo Zhanfg/Zhanfg --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" "$MOD" /tmp/mfga/SHA256SUMS.txt /tmp/mfga/ZIP-TEST.txt --repo Zhanfg/Zhanfg --title 'MFGA Fast Public 20260828 r1' --notes 'DIRECT FLASH ZIP. Download MFGA-LXGW-SourceSans3-FastPublic-20260828.zip itself. This Release asset has module.prop at ZIP root and is not an Actions artifact wrapper. Static QA passed; device boot remains unverified.'
