name: Sync MFGA upstream snapshot

on:
  push:
    branches:
      - sync/mfga-upstream-20260829
    paths:
      - .github/workflows/mfga-upstream-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream MFGA
        run: |
          set -euo pipefail
          rm -rf /tmp/mfga-upstream
          git clone --depth 1 --branch main https://github.com/Numbersf/MakeFontsGreatAgain.git /tmp/mfga-upstream
          git -C /tmp/mfga-upstream rev-parse HEAD > /tmp/upstream-sha

      - name: Mirror upstream working tree
        run: |
          set -euo pipefail
          # GitHub Actions' GITHUB_TOKEN cannot create/update workflow files.
          # Mirror everything else here; upstream workflows are copied separately
          # through the GitHub connector after this snapshot succeeds.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/mfga-upstream/ ./

          UPSTREAM_SHA="$(cat /tmp/upstream-sha)"
          cat > .mfga-upstream-sync <<EOF
          upstream=Numbersf/MakeFontsGreatAgain
          branch=main
          commit=${UPSTREAM_SHA}
          synced_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit synchronized snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          UPSTREAM_SHA="$(cat /tmp/upstream-sha)"
          git commit -m "chore: sync MFGA upstream ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:sync/mfga-upstream-20260829
