name: AMTool Next

on:
  workflow_dispatch:
  push:
    branches:
      - project/amtool-next-v2
    paths:
      - "amtool-next/**"
      - ".github/workflows/amtool-next.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37
        shell: bash
        run: yes | sdkmanager "platforms;android-37"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build and test
        working-directory: amtool-next
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          APK="$(find amtool-next/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F "META-INF/xposed/java_init.list"
          unzip -l "$APK" | grep -F "META-INF/xposed/module.prop"
          unzip -l "$APK" | grep -F "META-INF/xposed/scope.list"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMTool-Next-2.0.0-alpha1-debug
          path: amtool-next/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
