plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'cc.axymorrsen.phigrosextractor'
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId 'cc.axymorrsen.phigrosextractor'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // GitHub-hosted runners generate a different debug certificate on
            // different runs. A separate recovery application ID lets this APK
            // coexist with the user's currently installed build so Root can
            // rescue its already-extracted OGG cache before the old app is removed.
            applicationIdSuffix '.resume'
            versionNameSuffix '-resume'
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES'
            ]
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython('python3.13')
        pip {
            install 'lz4'
            install './vendor/python-fsb5'
            install 'chaquopy-libogg'
            install 'chaquopy-libvorbis'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha25'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.arthenica:ffmpeg-kit-next:8.1.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
